<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Alternate Story</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">

        <!-- Summary Header -->
        <div class="fade-in" style="text-align: center; margin-bottom: 3rem;">
            <h1 style="font-size: 2.5rem; line-height: 1.2;">
                <span class="text-primary" id="userNameTitle">User</span>, this was<br>one version of your life 🌈
            </h1>

            <!-- RESTORED: Narrative Paragraph -->
            <div
                style="max-width: 600px; margin: 1.5rem auto; font-family: 'Poppins', sans-serif; font-style: italic; opacity: 0.8; font-size: 1.1rem; line-height: 1.6;">
                <p id="cinematicStory"></p>
            </div>

            <p id="storySubtitle" style="font-size: 1rem; opacity: 0.6; margin-top: 1rem;"></p>
        </div>

        <!-- Timeline -->
        <div class="timeline-container" id="timeline">
            <!-- Events injected here -->
        </div>

        <!-- Reflection Card -->
        <div class="card fade-in" style="max-width: 700px; margin: 0 auto; background: #fffbe6; border-color: #ffd700;">
            <h2 id="reflectionTitle" style="color: #d4a000;"></h2>
            <p id="reflectionText" style="font-size: 1.1rem; margin: 1rem 0;"></p>
            <div style="margin-top: 1.5rem; font-weight: 700; color: var(--primary); font-style: italic;">
                🤔 <span id="moralQuestion"></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls fade-in delay-2" style="text-align: center; margin-top: 4rem;">
            <a href="index.html" class="btn-primary" style="font-size: 1.2rem; padding: 1rem 2.5rem;">Try A Different
                Path 🔄</a>
            <div class="privacy-note">
                Everything happened on your device. Zero data sent.
            </div>
        </div>

    </main>

    <!-- Scripts loaded in order -->
    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/result.js"></script>

    <script>
        // Inline update for specific header
        const inputs = JSON.parse(localStorage.getItem('userInputs'));
        if (inputs && inputs.name) {
            document.getElementById('userNameTitle').innerText = inputs.name;
        }
    </script>
</body>

</html>
